<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lore.Land · Offline</title>
  <meta name="theme-color" content="#2F483A">
  <link rel="icon" href="/book/pwa/icons/favicon.svg" type="image/svg+xml">
  <!-- Self-contained by design: this page is the service worker's network-loss
       fallback, so it carries its own styles and script and promises nothing it
       cannot render from cache alone (lore-c005-offline-honesty). The shelf
       below lists only chapters that are actually in the cache. -->
  <style>
    :root {
      --field: #2F483A;
      --edge: #1F2213;
      --paper: #1b2620;
      --ink: #ecdfc4;
      --ink-soft: #bcae93;
      --gold: #CDAA72;
      --gold-light: #E6C98F;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: radial-gradient(90rem 60rem at 50% 30%, var(--field), var(--edge) 70%);
      color: var(--ink);
      font-family: Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 34rem);
      display: grid;
      gap: 0.9rem;
      justify-items: center;
      text-align: center;
      padding: clamp(1.4rem, 5vw, 2.4rem);
      border: 1px solid rgba(205, 170, 114, 0.22);
      border-radius: 16px;
      background: rgba(27, 38, 32, 0.86);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
    }

    svg { width: 2.2rem; height: auto; }

    .wordmark {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.34em;
      color: var(--gold);
    }

    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(1.5rem, 5vw, 2rem);
      line-height: 1.15;
      color: var(--gold-light);
    }

    p { margin: 0; color: var(--ink-soft); }

    .shelf {
      width: 100%;
      display: grid;
      gap: 0.35rem;
      margin: 0.4rem 0 0;
      padding: 0;
      list-style: none;
      text-align: left;
    }

    .shelf a {
      display: grid;
      grid-template-columns: 2.6rem minmax(0, 1fr);
      align-items: baseline;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      color: var(--ink);
      text-decoration: none;
      background: rgba(205, 170, 114, 0.06);
    }

    .shelf a:hover,
    .shelf a:focus-visible {
      background: rgba(205, 170, 114, 0.16);
      outline: 1px solid var(--gold);
    }

    .shelf .num {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--gold);
    }

    .doors {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }

    .doors a,
    .doors button {
      padding: 0.45rem 1rem;
      border: 1px solid rgba(205, 170, 114, 0.45);
      border-radius: 999px;
      background: transparent;
      color: var(--gold-light);
      font: inherit;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main aria-labelledby="offline-title">
    <svg viewBox="0 0 30 32" aria-hidden="true">
      <path d="M15 2 C16.4 5 18.6 7.4 20.2 10.2 C20.6 11 20.8 11.8 21.4 12.3 C22.6 12.8 24.4 13.4 24.8 15.6 C25.2 19 22.4 22.8 19.2 25.4 C17.6 26.7 16.2 27.9 15 29.6 C13.8 27.9 12.4 26.7 10.8 25.4 C7.6 22.8 4.8 19 5.2 15.6 C5.6 13.4 7.4 12.8 8.6 12.3 C9.2 11.8 9.4 11 9.8 10.2 C11.4 7.4 13.6 5 15 2 Z" fill="none" stroke="#CDAA72" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M15 29.6 C14.8 26.5 14.9 23.5 15.3 20.5" fill="none" stroke="#CDAA72" stroke-width="0.7" stroke-linecap="round" opacity="0.75"/>
    </svg>
    <p class="wordmark">LORE . LAND</p>
    <h1 id="offline-title">The lantern is banked</h1>
    <p id="offline-lede">You are offline. Anything new waits, hearthward and patient, until you reconnect.</p>
    <ol class="shelf" id="shelf" hidden></ol>
    <div class="doors">
      <button type="button" id="retry">Try the network again</button>
      <a href="/">The entrance</a>
    </div>
  </main>
  <script>
    /* The shelf: chapters this browser has kept (sw.js, lore-pages-v1). */
    (async () => {
      if (!('caches' in window)) return;
      try {
        const cache = await caches.open('lore-pages-v1');
        const keys = (await cache.keys())
          .map((request) => new URL(request.url))
          .filter((url) => /^\/book\/chapter\/\d{2}\/$/.test(url.pathname))
          .sort((a, b) => a.pathname.localeCompare(b.pathname));
        if (!keys.length) return;
        const shelf = document.getElementById('shelf');
        for (const url of keys) {
          const response = await cache.match(url.href);
          const html = response ? await response.text() : '';
          const title = ((html.match(/<title[^>]*>([^<|]*)/i) || [])[1] || '').trim();
          const num = url.pathname.match(/(\d{2})/)[1];
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = url.pathname;
          const n = document.createElement('span');
          n.className = 'num';
          n.textContent = num;
          const t = document.createElement('span');
          t.textContent = title || 'Chapter ' + num;
          link.append(n, t);
          item.append(link);
          shelf.append(item);
        }
        shelf.hidden = false;
        document.getElementById('offline-lede').textContent =
          'You are offline, but these chapters are on your shelf and read in full.';
      } catch (error) { /* the shelf is a courtesy; the page stands without it */ }
    })();
    document.getElementById('retry').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
