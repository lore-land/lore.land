    <path d="M15 65h136v25H15ZM25 278h116l-15 24H40Z" fill="#211d1c" stroke-width="5"/>
    <path d="M83 148 C72 172 70 196 75 208 C80 220 86 220 91 208 C96 196 94 172 83 148 Z" fill="#ffb84d" stroke="none" opacity=".85"/>
    <ellipse cx="83" cy="198" rx="8" ry="18" fill="#fff4cf" stroke="none" opacity=".95"/>
  </g>

  <g aria-hidden="true">
    <ellipse cx="658" cy="554" rx="286" ry="86" fill="#24191a" opacity=".58" filter="url(#softShadow)"/>
    <path d="M420 424c-8-104 93-180 238-180 139 0 244 73 238 174-5 91-104 158-238 158-132 0-231-65-238-152Z" fill="url(#crust)" stroke="#5d3823" stroke-width="13"/>
    <g clip-path="url(#pieBody)">
      <ellipse cx="658" cy="391" rx="218" ry="137" fill="url(#pieTop)"/>
      <path d="M625 272 866 464M500 316l262 235M472 407l182 151M687 264 465 468M766 284 532 539M838 337 630 566" stroke="#edc278" stroke-width="28" opacity=".88"/>
      <path d="M625 272 866 464M500 316l262 235M472 407l182 151M687 264 465 468M766 284 532 539M838 337 630 566" stroke="#8b4e29" stroke-width="5" opacity=".54"/>
      <g fill="#76243d" opacity=".9">
        <circle cx="553" cy="359" r="15"/><circle cx="647" cy="330" r="13"/><circle cx="731" cy="374" r="16"/>
        <circle cx="605" cy="439" r="14"/><circle cx="787" cy="446" r="13"/>
      </g>
    </g>
    <path d="M659 389 853 526c51-62 57-125 24-181Z" fill="#311a22" opacity=".96"/>
    <path d="M659 389 879 346c24 47 17 115-27 180Z" fill="url(#filling)" stroke="#52252b" stroke-width="7"/>
    <path d="M659 389 879 346" stroke="#f0c274" stroke-width="25" stroke-linecap="round"/>
    <path d="M659 389 851 526" stroke="#b66d36" stroke-width="17" stroke-linecap="round"/>
    <path d="M452 392c35-96 120-137 210-139 106-2 187 42 220 117" fill="none" stroke="#f3c981" stroke-width="34" stroke-linecap="round" opacity=".92"/>
    <path d="M455 393c38-91 119-128 207-130 99-2 176 38 216 110" fill="none" stroke="#8e542d" stroke-width="7" stroke-dasharray="5 20" stroke-linecap="round" opacity=".7"/>
