  <path d="M0 447c188-91 343-14 495-69 175-63 337 49 514-22 146-58 270-19 431 22v294H0Z" fill="url(#field)"/>
  <g fill="none" stroke-linecap="round" opacity=".33">
    <path d="M-20 558c199-100 367-77 539 13" stroke="#86a17e" stroke-width="12"/>
    <path d="M813 461c205-102 420-79 662 20" stroke="#789474" stroke-width="10"/>
    <path d="M79 455c104-49 215-51 332-8M963 391c94-35 204-36 322 1" stroke="#bdd0a0" stroke-width="3"/>
  </g>
  <g fill="#b7d19c" opacity=".55">
    <ellipse cx="116" cy="438" rx="8" ry="4"/><ellipse cx="139" cy="427" rx="6" ry="3"/>
    <ellipse cx="1222" cy="385" rx="8" ry="4"/><ellipse cx="1251" cy="391" rx="6" ry="3"/>
  </g>

  <ellipse cx="871" cy="589" rx="380" ry="159" fill="#111c22" opacity=".35" filter="url(#softShadow)"/>
  <path d="M105 602c164-66 344-29 488 17 180 58 391-53 742-54l105 245H0Z" fill="#422d27"/>
  <path d="M247 572c219 11 360 70 550 50 177-18 280-86 502-42l-76 230H186Z" fill="url(#cloth)"/>
  <path d="M247 572c219 11 360 70 550 50 177-18 280-86 502-42" fill="none" stroke="#eee0bd" stroke-width="8" opacity=".5"/>

  <circle cx="1087" cy="448" r="232" fill="url(#lanternGlow)"/>
  <g transform="translate(1004 286)" stroke="#302622" stroke-linejoin="round">
    <path d="M38 61C35 17 58 1 83 1s49 16 45 60" fill="none" stroke-width="16" stroke-linecap="round"/>
