  <path d="M1138 692c94-15 174-79 187-172 9-67-18-119-75-146" fill="none" stroke="#f2cf83" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 18" opacity=".62"/>
  <rect width="1440" height="810" fill="url(#paperGrain)"/>
  <path d="M0 0h1440v810H0Z" fill="none" stroke="#f8e6b8" stroke-width="18" opacity=".12"/>
</svg>