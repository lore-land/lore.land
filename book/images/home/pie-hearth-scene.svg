<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">The pie at the edge of the warm furrow</title>
  <desc id="description">A berry pie with one slice missing rests on a cloth beside a lantern. Crumbs lead from the table into blue fields beneath a crescent moon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102d3a"/>
      <stop offset="0.52" stop-color="#315967"/>
      <stop offset="1" stop-color="#d49259"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#315848"/>
      <stop offset="0.55" stop-color="#173f3d"/>
      <stop offset="1" stop-color="#0c292f"/>
    </linearGradient>
    <radialGradient id="lanternGlow">
      <stop stop-color="#ffd98b" stop-opacity=".92"/>
      <stop offset=".38" stop-color="#e8a34e" stop-opacity=".42"/>
      <stop offset="1" stop-color="#e8a34e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pieTop" cx="43%" cy="36%">
      <stop stop-color="#d8a456"/>
      <stop offset=".7" stop-color="#a9602e"/>
      <stop offset="1" stop-color="#704023"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f0c172"/>
      <stop offset=".52" stop-color="#c47b36"/>
      <stop offset="1" stop-color="#744326"/>
    </linearGradient>
    <linearGradient id="filling" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7f2239"/>
      <stop offset=".55" stop-color="#3f1831"/>
      <stop offset="1" stop-color="#1d1728"/>
    </linearGradient>
    <pattern id="cloth" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(7)">
      <rect width="52" height="52" fill="#d5c49e"/>
      <path d="M0 0H52M0 26H52M0 52H52M0 0V52M26 0V52M52 0V52" stroke="#61766d" stroke-width="3" opacity=".28"/>
      <path d="M0 13H52M13 0V52M39 0V52" stroke="#f1e4c7" opacity=".28"/>
    </pattern>
    <pattern id="paperGrain" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M5 18l22-4M54 9l29 6M13 67l35 5M63 53l20-3M31 38l14 2" stroke="#fff" stroke-width="2" opacity=".045"/>
      <path d="M8 45l18 3M49 78l34-5M60 29l24 4" stroke="#071c22" stroke-width="2" opacity=".06"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="crumbGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pieBody">
      <path d="M420 424c-8-104 93-180 238-180 139 0 244 73 238 174-5 91-104 158-238 158-132 0-231-65-238-152Z"/>
    </clipPath>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#f4dda3" stop-opacity=".32"/>
      <stop offset=".4" stop-color="#f4dda3" stop-opacity=".1"/>
      <stop offset="1" stop-color="#f4dda3" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescentMoon">
      <rect width="1440" height="810" fill="#000"/>
      <circle cx="1117" cy="137" r="58" fill="#fff"/>
      <circle cx="1142" cy="117" r="61" fill="#000"/>
    </mask>
  </defs>

  <rect width="1440" height="810" fill="url(#sky)"/>
  <circle cx="1105" cy="142" r="130" fill="url(#moonGlow)"/>
  <circle cx="1117" cy="137" r="58" fill="#f4dda3" opacity=".92" mask="url(#crescentMoon)"/>
