    <circle cx="122" cy="79" r="12" fill="#9d3151"/><circle cx="163" cy="91" r="9" fill="#c5475f"/>
  </g>

  <g fill="#edc477" stroke="#75472b" stroke-width="3" filter="url(#crumbGlow)">
