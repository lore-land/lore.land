    <g fill="none" stroke="#f4dda3" stroke-linecap="round" opacity=".35">
      <path d="M785 330 C775 295 805 270 790 235 C780 210 795 185 788 165" stroke-width="3"/>
      <path d="M820 350 C808 318 834 295 824 260 C816 235 828 218 822 198" stroke-width="2.2" opacity=".7"/>
