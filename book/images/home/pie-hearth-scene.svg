  </g>

  <g transform="translate(892 533) rotate(12)">
    <ellipse cx="116" cy="111" rx="126" ry="34" fill="#2a2020" opacity=".38" filter="url(#softShadow)"/>
    <path d="M0 102 153 30l74 101c-72 38-151 30-227-29Z" fill="url(#filling)" stroke="#5d3527" stroke-width="7"/>
    <path d="m0 102 153-72 18 25L22 126Z" fill="#e6b866" stroke="#754426" stroke-width="7"/>
