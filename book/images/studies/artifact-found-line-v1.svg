<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="found-line-t found-line-d">
  <title id="found-line-t">A found line — a study</title>
  <desc id="found-line-d">Cobbles under low raking light, and painted across them five words in a line, kept from the road one at a time: one boxed in ink where a hop landed on it, one with a berry stain where a slice came down, one underlined in gold where it was walked.</desc>
  <defs>
    <radialGradient id="found-line-ground" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#26362c"/><stop offset="0.6" stop-color="#15221c"/><stop offset="1" stop-color="#0b1310"/>
    </radialGradient>
    <radialGradient id="found-line-glow" cx="50%" cy="57.49999999999999%" r="42%">
      <stop offset="0" stop-color="#f2b04e" stop-opacity="0.5"/><stop offset="0.55" stop-color="#f2b04e" stop-opacity="0.09"/><stop offset="1" stop-color="#f2b04e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="found-line-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb3a8" stop-opacity="0.28"/><stop offset="0.5" stop-color="#5fb3a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="found-line-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="found-line-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.94  0 0 0 0 0.89  0 0 0 0 0.78  0 0 0 0.09 0"/>
    </filter>
    <filter id="found-line-soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
