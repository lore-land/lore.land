<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="gate-book-entry-t gate-book-entry-d">
  <title id="gate-book-entry-t">The gate-book entry — a study</title>
  <desc id="gate-book-entry-d">The parcel gate's ledger open under a hooded lamp, ruled columns and one row filled in a careful hand, with a single word under remarks: parcel.</desc>
  <defs>
    <radialGradient id="gate-book-entry-ground" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#26362c"/><stop offset="0.6" stop-color="#15221c"/><stop offset="1" stop-color="#0b1310"/>
    </radialGradient>
    <radialGradient id="gate-book-entry-glow" cx="50%" cy="30%" r="42%">
      <stop offset="0" stop-color="#f2b04e" stop-opacity="0.62"/><stop offset="0.55" stop-color="#f2b04e" stop-opacity="0.11159999999999999"/><stop offset="1" stop-color="#f2b04e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate-book-entry-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb3a8" stop-opacity="0.28"/><stop offset="0.5" stop-color="#5fb3a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gate-book-entry-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="gate-book-entry-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.94  0 0 0 0 0.89  0 0 0 0 0.78  0 0 0 0.09 0"/>
    </filter>
    <filter id="gate-book-entry-soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#gate-book-entry-ground)"/>
  <rect width="600" height="400" fill="url(#gate-book-entry-rim)"/>
  <rect width="600" height="400" fill="url(#gate-book-entry-glow)"/>
