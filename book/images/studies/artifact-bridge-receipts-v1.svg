<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="bridge-receipts-t bridge-receipts-d">
  <title id="bridge-receipts-t">Two receipts on the rail — a study</title>
  <desc id="bridge-receipts-d">Two paper slips pinned side by side with worn brass pins on the confluence bridge rail, the river below split down its seam, berry-dark on one side and chalk-pale on the other.</desc>
  <defs>
    <radialGradient id="bridge-receipts-ground" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#26362c"/><stop offset="0.6" stop-color="#15221c"/><stop offset="1" stop-color="#0b1310"/>
    </radialGradient>
    <radialGradient id="bridge-receipts-glow" cx="50%" cy="42.5%" r="42%">
      <stop offset="0" stop-color="#f2b04e" stop-opacity="0.45"/><stop offset="0.55" stop-color="#f2b04e" stop-opacity="0.081"/><stop offset="1" stop-color="#f2b04e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bridge-receipts-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb3a8" stop-opacity="0.28"/><stop offset="0.5" stop-color="#5fb3a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bridge-receipts-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="bridge-receipts-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.94  0 0 0 0 0.89  0 0 0 0 0.78  0 0 0 0.09 0"/>
    </filter>
    <filter id="bridge-receipts-soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#bridge-receipts-ground)"/>
  <rect width="600" height="400" fill="url(#bridge-receipts-rim)"/>
  <rect width="600" height="400" fill="url(#bridge-receipts-glow)"/>
  <g fill="none" stroke="#efe3c8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="270" width="300" height="130" fill="#3a1f33" stroke="none" opacity="0.7"/>
    <rect x="300" y="270" width="300" height="130" fill="#cfcab8" stroke="none" opacity="0.18"/>
    <path d="M300 270v130" stroke="#efe3c8" stroke-opacity="0.45" stroke-dasharray="4 6"/>
    <path d="M20 290q40-8 80 0t80 0 80 0M330 290q40-6 80 0t80 0" stroke="#5fb3a8" stroke-opacity="0.3" stroke-width="1.2"/><path d="M20 320q40-8 80 0t80 0 80 0M330 320q40-6 80 0t80 0" stroke="#5fb3a8" stroke-opacity="0.3" stroke-width="1.2"/><path d="M20 350q40-8 80 0t80 0 80 0M330 350q40-6 80 0t80 0" stroke="#5fb3a8" stroke-opacity="0.3" stroke-width="1.2"/>
    <path d="M30 150H570M30 166H570" stroke-width="2.4"/>
    <path d="M60 166V262" stroke-width="2.2"/><path d="M200 166V262" stroke-width="2.2"/><path d="M400 166V262" stroke-width="2.2"/><path d="M540 166V262" stroke-width="2.2"/>
    <path d="M30 262H570" stroke-opacity="0.6"/>
    <g transform="rotate(-3 240 196)"><rect x="200" y="160" width="84" height="104" fill="#e8d9b4" fill-opacity="0.2"/><rect x="200" y="160" width="84" height="104"/>
      <path d="M212 186h60" stroke-opacity="0.45" stroke-width="1.2"/><path d="M212 202h60" stroke-opacity="0.45" stroke-width="1.2"/><path d="M212 218h60" stroke-opacity="0.45" stroke-width="1.2"/><path d="M212 234h60" stroke-opacity="0.45" stroke-width="1.2"/></g>
    <g transform="rotate(4 360 196)"><rect x="318" y="160" width="84" height="104" fill="#e8d9b4" fill-opacity="0.2"/><rect x="318" y="160" width="84" height="104"/>
      <path d="M330 186h60" stroke-opacity="0.45" stroke-width="1.2"/><path d="M330 202h60" stroke-opacity="0.45" stroke-width="1.2"/><path d="M330 218h60" stroke-opacity="0.45" stroke-width="1.2"/><path d="M330 234h60" stroke-opacity="0.45" stroke-width="1.2"/></g>
    <circle cx="242" cy="158" r="5" fill="#f2b04e" stroke="none"/><circle cx="360" cy="158" r="5" fill="#f2b04e" stroke="none"/>
  </g>
  <rect width="600" height="400" filter="url(#bridge-receipts-grain)"/>
  <rect width="600" height="400" fill="url(#bridge-receipts-vignette)"/>
</svg>
