<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="pressed-rose-t pressed-rose-d">
  <title id="pressed-rose-t">A pressed rose — a study</title>
  <desc id="pressed-rose-d">A page of small print seen from above, its last lines finer than the rest, and a dark rose pressed flat across them: the petals gone the colour of old wine, one thorn still on the stem, the first word of the clause showing under a petal, a crease where the page was shut on it.</desc>
  <defs>
    <radialGradient id="pressed-rose-ground" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#26362c"/><stop offset="0.6" stop-color="#15221c"/><stop offset="1" stop-color="#0b1310"/>
    </radialGradient>
    <radialGradient id="pressed-rose-glow" cx="53.333333333333336%" cy="67.5%" r="42%">
      <stop offset="0" stop-color="#f2b04e" stop-opacity="0.45"/><stop offset="0.55" stop-color="#f2b04e" stop-opacity="0.081"/><stop offset="1" stop-color="#f2b04e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pressed-rose-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb3a8" stop-opacity="0.28"/><stop offset="0.5" stop-color="#5fb3a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pressed-rose-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="pressed-rose-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.94  0 0 0 0 0.89  0 0 0 0 0.78  0 0 0 0.09 0"/>
    </filter>
    <filter id="pressed-rose-soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#pressed-rose-ground)"/>
  <rect width="600" height="400" fill="url(#pressed-rose-rim)"/>
  <rect width="600" height="400" fill="url(#pressed-rose-glow)"/>
