<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="horn-button-t horn-button-d">
  <title id="horn-button-t">The horn button — a study</title>
  <desc id="horn-button-d">A round horn button with two thread-holes, scuffed where it was trodden in the plaza, at rest on the parcel gate's wet iron threshold; a single drawn line, the figure's arm, reaches in from the dark to lift it.</desc>
