<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="damage-slip-t damage-slip-d">
  <title id="damage-slip-t">The signed DAMAGE slip — a study</title>
  <desc id="damage-slip-d">A feast clerk's slip stamped DAMAGE in smudged red, flour paste drying on its corner, and on the line where the cause should go, the porter's own signature pressed hard into the paper; spoiled sacks behind.</desc>
  <defs>
    <radialGradient id="damage-slip-ground" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#26362c"/><stop offset="0.6" stop-color="#15221c"/><stop offset="1" stop-color="#0b1310"/>
    </radialGradient>
    <radialGradient id="damage-slip-glow" cx="50%" cy="50%" r="42%">
      <stop offset="0" stop-color="#f2b04e" stop-opacity="0.5"/><stop offset="0.55" stop-color="#f2b04e" stop-opacity="0.09"/><stop offset="1" stop-color="#f2b04e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="damage-slip-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb3a8" stop-opacity="0.28"/><stop offset="0.5" stop-color="#5fb3a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="damage-slip-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="damage-slip-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.94  0 0 0 0 0.89  0 0 0 0 0.78  0 0 0 0.09 0"/>
    </filter>
    <filter id="damage-slip-soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#damage-slip-ground)"/>
  <rect width="600" height="400" fill="url(#damage-slip-rim)"/>
  <rect width="600" height="400" fill="url(#damage-slip-glow)"/>
  <g fill="none" stroke="#efe3c8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 330q30-60 70-60t70 60z" fill="#e8d9b4" fill-opacity="0.08" stroke-opacity="0.35"/>
    <path d="M420 330q30-70 75-70t70 70z" fill="#e8d9b4" fill-opacity="0.08" stroke-opacity="0.35"/>
    <g transform="rotate(-6 300 210)">
      <rect x="170" y="110" width="260" height="190" fill="#e8d9b4" fill-opacity="0.14"/>
      <rect x="170" y="110" width="260" height="190"/>
      <text x="300" y="168" fill="#c8483c" fill-opacity="0.85" stroke="none" font-family="ui-monospace, monospace" font-weight="700" font-size="34" letter-spacing="6" text-anchor="middle">DAMAGE</text>
      <rect x="196" y="134" width="208" height="46" stroke="#c8483c" stroke-opacity="0.6" stroke-width="2.4"/>
      <path d="M196 214H404" stroke-opacity="0.35" stroke-width="1.2"/>
      <path d="M196 254H404" stroke-opacity="0.6" stroke-width="1.2"/>
      <path d="M206 250c14-20 22 4 34-10s16 10 28-4 14 12 26-2 20 6 40-4" stroke="#f2b04e" stroke-width="2.2"/>
      <path d="M400 112q22 6 28 26" fill="#e8d9b4" fill-opacity="0.35" stroke="#efe3c8" stroke-opacity="0.4"/>
    </g>
  </g>
  <rect width="600" height="400" filter="url(#damage-slip-grain)"/>
  <rect width="600" height="400" fill="url(#damage-slip-vignette)"/>
</svg>
