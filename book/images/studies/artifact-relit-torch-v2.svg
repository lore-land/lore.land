<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="relit-torch-t relit-torch-d">
  <title id="relit-torch-t">The relit torch — a study</title>
  <desc id="relit-torch-d">A ruled ant-street running dead straight across frosted loam to one ant holding up a tiny torch, lit again from the warm tip of a long drawn line that ends a little early.</desc>
  <defs>
    <radialGradient id="relit-torch-ground" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#26362c"/><stop offset="0.6" stop-color="#15221c"/><stop offset="1" stop-color="#0b1310"/>
    </radialGradient>
    <radialGradient id="relit-torch-glow" cx="75%" cy="50%" r="42%">
      <stop offset="0" stop-color="#f2b04e" stop-opacity="0.72"/><stop offset="0.55" stop-color="#f2b04e" stop-opacity="0.1296"/><stop offset="1" stop-color="#f2b04e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="relit-torch-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb3a8" stop-opacity="0.28"/><stop offset="0.5" stop-color="#5fb3a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="relit-torch-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="relit-torch-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.94  0 0 0 0 0.89  0 0 0 0 0.78  0 0 0 0.09 0"/>
    </filter>
    <filter id="relit-torch-soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
