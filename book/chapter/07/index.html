        <h1>Chapter 07: Blueberry Oath</h1>
        <p class="chapter-epigraph">Every wish is paid twice: once by the wisher, once by someone who never hears about it.</p>
        <p>Chapter 7 of Lore.Land: Blueberry Oath. An oath is a key given in public, paid in fruit, with the unspent wish as witness. Boof swears to spend the wish only when the want is true, while the Fool samples the sworn-oath trope and the shadow names the correction someone else will pay.</p>
