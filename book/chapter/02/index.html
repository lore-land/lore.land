          "text": "Boof understood, pacing the mossy fork, that the grove was not a memory palace. It was a rehearsal hall for the unfinished—overflow storage for every wanting the town had declined to sound. Each echo offered her a future off the rack: the egg as rain, the egg as harvest, the egg as a door back to some morning she had liked better than this one. Every one of them fit almost. None of them would finish the wish. The grove could repeat the hum forever; repeating a wish is not the same as granting it, any more than sniffing a trail is the same as arriving."
