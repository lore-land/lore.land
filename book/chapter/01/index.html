      "data-motif": "unspent-wish",
      "content": [
        {
          "type": "paragraph",
          "text": "Dawn smelled of frost and wet fur. Boof put her nose to the ground. Beneath the berry rows, ants kept their little hearths. Their patient magic warmed the roots through winter. Above them, the boonberries slept under ice, each holding a drop of light. Boof followed the rows past a fence leaning into last year's weeds, past the place where the miller's boots always stopped to scrape off mud. She knew what belonged to morning: the latch lifting at the kitchen, the bucket knocking the well, a blackbird trying the same few notes until one pleased it. Under all that, the ants worked without a sound she could hear. She paused now and then to sniff a root, and the field gave back its usual answers. That was why the strange warmth caught her before she saw the hole."
        },
        {
          "type": "paragraph",
          "text": "Boof knew this field. She worked for the land, wherever the fences stood, and took her wages in blueberries. Coin was difficult to chew."
        },
        {
          "type": "paragraph",
          "text": "She sniffed. Stepped. Stopped. One furrow was warm. Too warm. Beneath it, the ants had stopped working."
        },
        {

          "text": "Boof dug. First frost, then soft earth, then a little cloud of steam. At the bottom lay an egg the size of a curled cat, dark as an old lamp."
        },

          "type": "paragraph",
          "text": "She touched it with one paw. It hummed."
        },
        {
          "type": "paragraph",
          "text": "No nest. No tracks. No mother-scent. She went around the hole once more, slowly. Whatever had brought it here had left no way to follow."
        },
        {
          "type": "paragraph",
          "text": "Inside the shell, an unspent wish waited. Boof heard only the hum."
        }

      {
        "description": "Boof is a dog based on Spwashi's dog. She works for the land, not an owner—paid in blueberries, honest scents, and trails that end in something real. Her wants are small, and small wants are the hardest magic."
      },
      {
        "description": "Boonberries are blueberries a wish once passed over. Each holds a drop of the granting; they wake when they remember being wished over. They grow in cold weather only because ants warm the soil beneath them with a small, patient magic—the ant-hearths, a warmth the town spends without naming."
      },
      {
        "description": "The egg is an unspent wish—the last item in the ledger of a Discount Genie who closed his practice. Its hum is a held breath: a sentence stopped one word before the wishing word."
      },

        "description": "Boon.land's records hold only what has happened. An ungranted wish has not happened yet, so ink beads off the page; the maps end where its hum begins."
      },

        "description": "The field remembers a direction before the people do—the berries lean toward the grove, the way a granting once went."
      },

      },
