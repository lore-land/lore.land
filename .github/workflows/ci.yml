name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: spw:lint (parse every .spw file with the real spw-workbench grammar)
        run: npm run spw:lint -- --strict

      - name: spw:plans (what the plans claim, held against the tree)
        run: npm run spw:plans -- --strict

      - name: spw:seed-bundle:verify (vendored browser parser matches the current submodule pin)
        run: npm run spw:seed-bundle:verify

      - name: types (strict, over every tool that carries // @ts-check)
        run: npm run types

      - name: book:check (chapters, slots, bracework, almanac, anchors — c026)
        run: npm run book:check

      - name: board:check (the pie board on fourteen screens, and its Spw line out and back)
        run: npm run board:check

      - name: texture:finds:check (texture.website pieces from spwashi.com, linked, never copied)
        run: npm run texture:finds:check

      - name: formulas:check (Spw formulas compute; the land answers; held words stay held)
        run: npm run formulas:check

      - name: daily:check (a year of daily readings, none empty, none unreleased)
        run: npm run daily:check

      - name: play-graph:check (Spw read as game structures; the gradients)
        run: npm run play-graph:check

      - name: shelves:check (five shelves; odds, chains, tease, ecology, reasons)
        run: npm run shelves:check

      - name: cadence:check (a line of Spw as a loop, played eleven ways)
        run: npm run cadence:check

      - name: kitchen:check (wished dishes by character; mimed orders; the ants' gossip)
        run: npm run kitchen:check

      - name: seasons:check (a season's days, its spells, the sealed line it leaves, and who it stays set for)
        run: npm run seasons:check

      - name: reactions:check (who answers a knock, a power taken and a power run out; deeds are narration)
        run: npm run reactions:check

      - name: finds:check (a find's rule reads whole, rests on a want or a limit, opens by skill and never by gifts alone)
        run: npm run finds:check

      - name: jokes:check (a callback's rule reads whole, crosses a trope it is grounded in, and lands only words already written)
        run: npm run jokes:check

      - name: rhymes:build (refrains the parser finds across released chapters; a stale rhymes.json fails check)
        run: npm run rhymes:build

      - name: elaboration:check (each trope's five stages, in words and in Spw)
        run: npm run elaboration:check

      - name: sound:check (scored hooks; colour in range, stings rest, motifs grow, the figure unvoiced)
        run: npm run sound:check

      - name: pacing:check (story beats in a carry, paced; nothing dropped)
        run: npm run pacing:check

      - name: One version token per file (no module loaded twice)
        run: npm run tokens:align -- --check

      - name: build (chapters:build -> spw:export -> vite build -> spw:project -> dist:static)
        run: npm run build

      - name: dist:verify (shell assets + public .spw allowlist)
        run: npm run dist:verify

      - name: spw:probes (report only — known-open findings stay review-class, see .spw/state/plates-manifest.spw)
        run: npm run spw:probes
